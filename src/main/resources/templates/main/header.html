<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	<nav class="navbar navbar-inverse">
		<div class="container-fluid">
			<div class="navbar-header">
				<a class="navbar-brand" href="/">Pinia</a>
			</div>
			<ul class="nav navbar-nav">
				<li class="active"><a href="/">Home</a></li>
				<li class="dropdown">
					<a class="dropdown-toggle" data-toggle="dropdown" href="#">맛집
						<span class="caret"></span></a>
				<ul class="dropdown-menu">
					<li><a href="/food/find">맛집 검색</a></li>
					<li sec:authorize=""><a href="#">맛집 추천</a></li>
				</ul>
				</li>
				<li class="dropdown">
					<a class="dropdown-toggle" data-toggle="dropdown" href="#">레시피
						<span class="caret"></span></a>
				<ul class="dropdown-menu">
					<li><a href="/recipe/list">레시피 목록</a></li>
					<li><a href="/recipe/find">레시피 검색</a></li>
					<li><a href="/recipe/chef_list">쉐프 목록</a></li>
				</ul>
				</li>
				<li sec:authorize="isAuthenticated()"><a href="/chat">실시간 채팅</a></li>
				<li sec:authorize="isAuthenticated()"><a href="#">빠른 예약</a></li>
				<li><a href="/board/list">자유게시판</a></li>
			</ul>
			
			<ul class="nav navbar-nav navbar-right">
				<li sec:authorize="!isAuthenticated()"><a href="#"><span class="glyphicon glyphicon-user"></span> 회원가입</a></li>

				<li sec:authorize="isAuthenticated()">

					<a href="#">
						<span th:text="${session.username}"></span>(관리자) 님 로그인되었습니다
					</a>
				</li>
				<li sec:authorize="hasRole('MANAGER')">
					<a href="#">
						<span th:text="${session.username}"></span>(운영자) 님 로그인되었습니다
					</a>
				</li>
				<li sec:authorize="hasRole('USER')">
					<a href="#">
						<span th:text="${session.username}"></span>(일반사용자) 님 로그인되었습니다
					</a>
				</li>
				<li sec:authorize="isAuthenticated()">
					<a href="/member/logout">
						<span class="glyphicon glyphicon-log-in"></span> 로그아웃
