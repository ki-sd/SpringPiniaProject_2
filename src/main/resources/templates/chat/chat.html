<!DOCTYPE html>
<html>
<script th:inline="javascript">
	const LOGIN_USER=/*[[${session.userid}]]*/''
</script>
<style>
.container{
  margin-top: 50px;
}
.row {
  margin: 0px auto;
  width: 900px;
}
h3 {
   text-align: center
}
.chat-body{
   height: 450px;
   overflow-y:auto 
}
.my-msg{
  text-align: right;
  color:#337ab7
}
.user-panel {
  height: 100vh;
  border-right: 1px solid #ddd;
  background: #fff;
}

/* ===== 채팅 영역 ===== */
.chat-panel {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== 메시지 영역 ===== */
.chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  background: #b2c7da; /* 카카오톡 배경색 */
}

/* ===== 말풍선 공통 ===== */
.bubble {
  max-width: 60%;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 10px;
  position: relative;
  clear: both;
}

/* ===== 상대방 말풍선 ===== */
.bubble.left {
  background: #fff;
  float: left;
}

/* ===== 내 말풍선 ===== */
.bubble.right {
  background: #ffeb33;
  float: right;
}

/* ===== 시간 ===== */
.time {
  font-size: 11px;
  color: #666;
  margin-top: 3px;
  text-align: right;
}

/* ===== 입력 영역 ===== */
.chat-footer {
  padding: 10px;
  background: #eee;
}
</style>
<section>
	<div class="container" id="chatApp">
		<div class="row">
	        <!-- =====================================================
	             접속자 목록
	             ===================================================== -->
			<div class="col-sm-3 user-panel">
				<h4 class="text-center">접속자</h4>
	            <!-- =================================================
	                 전체 채팅
	                 ================================================= -->
				<div class="list-group-item" style="cursor:pointer">
					<span class="glyphicon glyphicon-globe"></span>
	                전체 채팅
				</div>
				<br>
	            <!-- =================================================
	                 접속자
	                 ================================================= -->
				<div class="list-group-item" style="cursor:pointer">
					<span class="glyphicon glyphicon-user"></span>
				</div>
			</div>
	        <!-- =====================================================
	             채팅 영역
	             ===================================================== -->
			<div class="col-sm-9 chat-panel">
	            <!-- =================================================
	                 채팅 헤더
	                 ================================================= -->
				<div class="chat-header">
					<b></b>
				</div>
	            <!-- =================================================
	                 메시지
	                 ================================================= -->
				<div class="chat-body" ref="chatBody">
					<div class="message-row">
	                    <!-- =========================================
	                         상대방
	                         ========================================= -->
						<div  class="bubble left">
						<!-- 1:1에서만 이름 표시 -->
							<div  class="sender"></div>
						</div>
	                    <!-- =========================================
	                         내 메시지
	                         ========================================= -->
						<div class="bubble right"></div>
					</div>
				</div>
	            <!-- =================================================
	                 입력
	                 ================================================= -->
				<div class="chat-footer">
					<div class="input-group">
						<input type="text" class="form-control" placeholder="메시지 입력">
							<span class="input-group-btn">
								<button class="btn btn-warning">전송</button>
							</span>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
<script src="/vue/chat/chatStore.js"></script>
<script>
	const {createPinia}=Pinia
	const {ref,onMounted,createApp}=Vue
	const app=createApp({
		setUp(){
			const store=useChatStore()
			const chatBody=ref(null)
			onMounted(()=>{
				store.loginUser=LOGIN_USER
				store.chatBodyEl=chatBody.value()
				store.connect()
			})
			return {
				store,
				chatBody
			}
		}
	})
	app.use(createPinia())
	app.mount('#chatApp')
</script>
</html>
